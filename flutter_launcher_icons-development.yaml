# Development icons. Same artwork as production, on a blue background, so three
# installed builds are told apart at a glance rather than by reading [DEV] on the
# label. Writes to android/app/src/development/res and iOS AppIcon-development.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  # iOS gets a copy cropped to the artwork and scaled to 84% width. The adaptive
  # inset below is Android-only, so without this the source margins survive and
  # the gamepad reads small inside a rounded square. Still transparent, so
  # background_color_ios composites the flavor colour behind it.
  image_path_ios: "assets/icon/app_icon_ios.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#1E88E5"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 8
