<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sada games</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #10143a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10143a;
          --fg: #ffffff;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 600 clamp(2rem, 9vw, 4rem) / 1.2 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Sada games</h1>
  </body>
</html>
