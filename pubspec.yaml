name: sadagames
description: Simple game collection
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  bloc: ^9.2.1
  equatable: ^2.1.0
  flame: ^1.38.0
  flame_behaviors: ^1.4.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_soloud: ^4.1.1
  google_fonts: ^8.2.0
  intl: ^0.20.2
  meta: ^1.18.0
  shared_preferences: ^2.5.5

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flame_test: ^2.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mockingjay: ^2.1.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/licenses/poppins/
