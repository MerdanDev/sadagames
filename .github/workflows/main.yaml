name: sadagames

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      run_bloc_lint: true
      # The workflow's default is 100, which this project cannot reach: the
      # SoLoud audio engine makes no sound under test and the games' render
      # paths are not exercised by unit tests. Today's figure is 57.3%; this
      # floor sits just under it and is meant to be ratcheted up, never down.
      min_coverage: 55

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      # `.claude/**` is listed on its own even though `**/*.md` looks like it
      # covers it. The action runs cspell with check_dot_files: explicit, so a
      # dot directory is skipped unless a glob names it — and the agent guide's
      # notes are exactly the docs worth keeping honest. Don't "simplify" the
      # second line away.
      includes: |
        **/*.md
        .claude/**/*.md
      modified_files_only: false
