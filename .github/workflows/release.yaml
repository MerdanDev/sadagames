name: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Deliberately not cancel-in-progress: cancelling a run midway through creating
  # a release or uploading an asset leaves the tag half published.
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  # Manual runs build and upload nothing, so the workflow can be exercised without
  # spending a version number on it.
  workflow_dispatch:

jobs:
  # A tag must not ship code that main would have rejected, so this is the same
  # reusable workflow main.yaml calls, with the same inputs.
  verify:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.x"
      run_bloc_lint: true
      min_coverage: 55

  build-android:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      # The tag is the single source of truth for the version, so pubspec.yaml is
      # left alone. run_number gives a build number that only ever climbs, which is
      # what Play requires and what makes two builds of one tag distinguishable.
      - name: 🔖 Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION}+${GITHUB_RUN_NUMBER}"

      # Written to the runner's temp directory rather than the workspace so it can
      # never be picked up by a later step that globs the checkout.
      - name: 🔐 Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the signing secrets before tagging a release."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"

      - name: 🤖 Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --flavor production \
            --target lib/main_production.dart \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${GITHUB_RUN_NUMBER}"
          mv build/app/outputs/flutter-apk/app-production-release.apk \
             "sadagames-${{ steps.version.outputs.name }}.apk"

      # always(), so a failed build does not leave the decoded key on the runner.
      - name: 🧹 Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload-keystore.jks"

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadagames-apk
          path: sadagames-*.apk
          if-no-files-found: error

  release:
    needs: build-android
    runs-on: ubuntu-latest
    # Only a tag publishes. A manual run stops after building, which is the point
    # of being able to trigger one.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: ⬇️ Download APK
        uses: actions/download-artifact@v4
        with:
          name: sadagames-apk

      - name: 🚀 Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: sadagames-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
